# Production stack for one host:
#   web    Caddy (HTTPS) serving the Expo web build and proxying /api -> server
#   server Node API (Google OAuth, Sheets/Drive, Claude), SQLite + uploads on a volume
#
# Usage (from the repo root on the host):
#   cp deploy/.env.example deploy/.env && cp deploy/server.env.example deploy/server.env
#   # edit both files
#   docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d --build
name: rental-ledger

services:
  server:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.server
    env_file: ./server.env
    environment:
      PORT: "8787"
      DATA_DIR: /data
      NODE_ENV: production
    volumes:
      - ledger-data:/data
    restart: unless-stopped
    expose:
      - "8787"

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
      args:
        EXPO_PUBLIC_API_URL: https://${SITE_DOMAIN}/api
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-${SITE_DOMAIN}}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - server
    restart: unless-stopped

volumes:
  ledger-data:
  caddy-data:
  caddy-config:
